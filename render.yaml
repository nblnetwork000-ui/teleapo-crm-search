services:
  - type: web
    name: teleapo-crm-search
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py || python app.py
    healthCheckPath: /login
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_REMOTE_ACCESS
        value: true
      - key: APP_MODE
        value: full
      - key: REQUESTS_PER_15_MIN
        value: 1000
      - key: ACCESS_USERS_JSON
        sync: false
      - key: ACCESS_MEMBER_ID
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: 店舗リスト
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: VOICEVOX_SPEAKER
        value: 24
  - type: web
    name: signal-event-search
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py || python app.py
    healthCheckPath: /login
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_REMOTE_ACCESS
        value: true
      - key: APP_MODE
        value: events
      - key: REQUESTS_PER_15_MIN
        value: 1000
      - key: ACCESS_USERS_JSON
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        value: nblnetwork.000@gmail.com
      - key: APP_BASE_URL
        value: https://signal-event-search.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: INVITE_FROM_EMAIL
        value: SIGNAL <onboarding@resend.dev>
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: イベントリスト
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: VOICEVOX_SPEAKER
        value: 24
