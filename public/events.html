<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIGNAL | イベント検索</title>
    <link rel="icon" type="image/png" href="./assets/signal-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./events.js" type="module"></script>
  </head>
  <body>
    <main class="app">
      <section class="panel" aria-labelledby="pageTitle">
        <div class="heading commandHeading">
          <div>
            <div class="signalBrand" aria-label="SIGNAL">
              <img src="./assets/signal-icon.png" alt="" />
              <span>SIGNAL</span>
            </div>
            <h1 id="pageTitle" class="srOnly">SIGNAL</h1>
            <p>営業機会につながるイベントを見つける</p>
            <p id="sheetName">追記先: 読み込み中</p>
          </div>
          <button id="appearanceToggle" class="modeToggle" type="button" aria-pressed="false">ライト</button>
        </div>

        <form id="eventForm" class="form searchForm">
          <label>
            キーワード
            <input id="eventKeyword" name="keyword" type="text" maxlength="80" placeholder="例: 交流会" value="交流会" required />
          </label>
          <div class="grid">
            <label>
              都道府県
              <select id="eventPrefecture" name="prefecture">
                <option value="">全国</option>
                <optgroup label="北海道・東北">
                  <option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option>
                </optgroup>
                <optgroup label="関東">
                  <option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option>
                </optgroup>
                <optgroup label="甲信越・北陸">
                  <option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option>
                </optgroup>
                <optgroup label="東海">
                  <option>岐阜県</option><option>静岡県</option><option>愛知県</option><option>三重県</option>
                </optgroup>
                <optgroup label="関西">
                  <option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option><option>奈良県</option><option>和歌山県</option>
                </optgroup>
                <optgroup label="中国・四国">
                  <option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option>
                </optgroup>
                <optgroup label="九州・沖縄">
                  <option>福岡県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option>
                </optgroup>
              </select>
            </label>
            <label>
              市区町村・主要エリア
              <select id="eventAreaDetail" name="areaDetail" disabled>
                <option value="">都道府県を選択</option>
              </select>
            </label>
          </div>
          <label>
            検索元
            <select id="eventSource" name="source">
              <option value="all">全部</option>
              <option value="kokuchpro">こくちーず（取得制限あり）</option>
              <option value="connpass">connpass</option>
              <option value="doorkeeper">Doorkeeper</option>
              <optgroup label="交流会サイト">
                <option value="doomo">Doomo</option>
                <option value="clip_tokyo">CLIP TOKYO</option>
                <option value="passion_leaders">Passion Leaders</option>
                <option value="tact">TACT</option>
                <option value="friendlink">フレンドリンク</option>
                <option value="lepane">レパン</option>
                <option value="hive_lab">Hive Lab</option>
                <option value="kobushi">KOBUSHI BEER</option>
                <option value="onlystory">OnlyStory</option>
                <option value="first_village">First Village</option>
                <option value="keizaikai">経済界倶楽部</option>
                <option value="flos">フロース</option>
                <option value="osaka_plus">OSAKA Plus</option>
                <option value="deal_den">Deal Den</option>
                <option value="cxo_meetup">CxO交流会カレンダー</option>
                <option value="doyu">中小企業家同友会</option>
                <option value="eventmado">イベマド</option>
              </optgroup>
              <option id="eventWebSource" value="web" hidden disabled>Web検索</option>
            </select>
          </label>
          <div class="grid">
            <label>
              開催日（開始）
              <input id="eventDateFrom" name="dateFrom" type="date" />
            </label>
            <label>
              開催日（終了）
              <input id="eventDateTo" name="dateTo" type="date" />
            </label>
          </div>
          <div class="grid">
            <label>
              参加費の金額帯
              <select id="eventFeeBand" name="feeBand">
                <option value="all">指定なし</option>
                <option value="free">無料</option>
                <option value="under3000">1〜3,000円</option>
                <option value="under5000">3,001〜5,000円</option>
                <option value="under10000">5,001〜10,000円</option>
                <option value="over10000">10,001円以上</option>
                <option value="unknown">金額不明</option>
              </select>
            </label>
            <label>
              参加費の並び順
              <select id="eventFeeSort" name="feeSort">
                <option value="date">開催日順</option>
                <option value="low">安い順</option>
                <option value="high">高い順</option>
              </select>
            </label>
          </div>
          <p class="fieldHint">掲載元から取得できた参加費で判定します。複数料金は最安額、金額不明は並び替え時に最後へ表示します。</p>
          <div class="grid">
            <label>
              件数
              <input id="eventResults" name="results" type="number" min="1" max="100" value="20" required />
            </label>
            <label class="check inline-check">
              <input name="append" type="checkbox" />
              シートへ追記
            </label>
          </div>
          <label class="check">
            <input name="futureOnly" type="checkbox" checked />
            今日以降のイベントのみ
          </label>
          <button id="eventSubmitButton" type="submit">イベント検索</button>
        </form>

        <p id="status" class="status" role="status"></p>
      </section>

      <section class="results" aria-labelledby="resultsTitle">
        <div class="toolbar">
          <h2 id="resultsTitle">取得結果</h2>
          <div class="toolbarActions">
            <span id="summary"></span>
            <a id="adminUsersLink" class="crmLink" href="/admin/users" hidden>利用者管理</a>
            <a class="crmLink" href="/logout">ログアウト</a>
          </div>
        </div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>イベント名</th>
                <th>開催場所</th>
                <th>時間</th>
                <th>参加費</th>
                <th>詳細</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
